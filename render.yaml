# Render Blueprint for Livo: one web service + one PostgreSQL database.
# In Render: New → Blueprint → pick this repo. Every push to main redeploys.
services:
  - type: web
    name: livo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: livo-db
          property: connectionString
      - key: LIVO_COMPANY_NAME
        value: MGL Limo Worldwide
      - key: LIVO_COMPANY_TZ
        value: America/Los_Angeles
      # Random code required to create the first owner account. Find it in
      # the service's Environment tab. Delete it after setup if you like.
      - key: LIVO_SETUP_CODE
        generateValue: true

databases:
  - name: livo-db
    databaseName: livo
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
